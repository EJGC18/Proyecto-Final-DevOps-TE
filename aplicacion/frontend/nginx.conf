server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Endpoint de salud para el health check del ALB
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # config.js no se cachea para poder cambiar la URL de la API sin reconstruir
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
