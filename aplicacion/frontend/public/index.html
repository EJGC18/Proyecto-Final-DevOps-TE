<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tareas DevOps · Proyecto Final</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Tareas DevOps</h1>
      <p class="sub">Frontend (nginx) + Backend (Express) en Amazon ECS Fargate</p>
    </header>

    <section class="estado">
      <div><span class="etq">Frontend</span><span id="ver-front">__APP_VERSION__</span></div>
      <div><span class="etq">Backend</span><span id="ver-back">…</span></div>
      <div><span class="etq">Tarea ECS</span><span id="host-back">…</span></div>
      <div><span class="etq">API</span><span id="salud" class="pill">comprobando…</span></div>
    </section>

    <form id="form">
      <input id="titulo" placeholder="Nueva tarea…" maxlength="200" autocomplete="off" required />
      <button type="submit">Agregar</button>
    </form>
    <p id="error" class="error" hidden></p>

    <ul id="lista"></ul>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
